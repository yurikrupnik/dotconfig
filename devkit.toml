# devkit configuration — copy to your monorepo root as `devkit.toml`.
#
# Every key is optional: it overrides a built-in default from devkit/config.nu.
# Only set what differs for your repo. Nested tables deep-merge; lists replace
# the default wholesale. devkit discovers this file by walking up from $PWD.

# --- Top-level keys MUST come before any [table] header (TOML rule) ---

# Explicit app namespaces created on `devkit up`.
# Leave empty ([]) to auto-derive from top-level dirs under paths.apps_dir.
app_namespaces = []

[cluster]
name = "dev"                 # Kind cluster name
workers = 2                  # worker node count
db_workers = 1              # tainted db-dedicated workers
ingress = true              # expose ports 80/443
# kcl_package = "oci://.../kcl/cluster"   # OCI url WITHOUT a tag
# kcl_tag = "0.0.6"                        # version passed to kcl via --tag

# Extra top-level args forwarded to `kcl run` as `-D key=value`.
# name/workers/db_workers/ingress come from flags/config above and win here.
# Empty values are skipped, so declaring a key without a value is a no-op.
# [cluster.kcl_args]
# oidc_bucket = "my-oidc-bucket"
# oidc_id = "dev-cluster"

# Cluster dependencies installed by `devkit cluster deps` (and `devkit up`).
# Helm rows: name, repo, chart (default: name), version, namespace (default:
# "default"), timeout (default: "10m"), values (a values file path or list of
# paths — helm -f, later files win — resolved against the devkit.toml dir),
# set (a key=value string or list — helm --set, wins over values files).
# Omit repo to use chart as a full reference (e.g. oci://...). Manifest rows:
# name + manifest (URL or repo-relative path, kubectl apply --server-side).
# Deps in the same wave (default 0) install in parallel; waves run in
# ascending order — bump wave when a dep needs another's CRDs/controllers.
#
# [[deps]]
# name = "crossplane"
# repo = "https://charts.crossplane.io/stable"
# version = "2.3.4"
# namespace = "crossplane-system"
# values = "manifests/values/crossplane.yaml"
#
# [[deps]]
# name = "cert-manager-crds"
# manifest = "https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.crds.yaml"

[namespaces]
dbs = "dbs"
monitoring = "monitoring"
external_secrets = "external-secrets"

[paths]
apps_dir = "apps"
compose_file = "manifests/dockers/compose.yaml"
default_target = "dev"      # default --target for overlay commands

#[paths.overlays]
## `{target}` is replaced by the --target flag (dev/staging/prod).
#core = "manifests/k8s/overlays/{target}"
#gitops = "manifests/k8s/overlays/{target}"
#observability = "manifests/k8s/overlays/{target}"

[database]
port = 5433
user = "myuser"
password = "mypassword"
name = "mydatabase"
migration_cmd = ["cargo", "run", "-p", "migration", "--", "up"]
wait_timeout = "120s"

[secrets]
config = "manifests/secrets/.vals.yaml"       # vals config file
output = ".env"             # generated env file

[external_secrets]
gcp_credentials = "~/dotconfig/tmp/secret-puller.json"
secret_name = "gcp-sm-credentials"
store_name = "gcp-secret-manager"  # ClusterSecretStore name your ExternalSecrets reference
# project_id = "my-gcp-project"    # unset = read project_id from the creds JSON
# chart_version = "0.18.2"         # ESO helm chart version; unset = latest

[flux]
# devkit installs Flux with the ControlPlane Flux Operator (helm chart +
# FluxInstance), never `flux bootstrap` — no commits are pushed and the
# operator pod serves the Flux Web UI (`devkit cluster flux-ui`).
owner = "yurikrupnik-org"          # GitHub user/org; leave unset to derive from `gh api user`
# gh_user = "my-user"       # gh account for the API token (multi-account setups); unset = active account
repository = "gitops"
branch = "main"
path = "clusters/local"     # sync path in the repo; created if missing
auth = "auto"               # auto | ssh (deploy key) | token (HTTPS basic auth)
namespace = "flux-system"
version = "2.x"             # Flux distribution version
registry = "ghcr.io/fluxcd"
components = ["source-watcher", "image-automation-controller", "image-reflector-controller", "source-controller", "kustomize-controller", "helm-controller", "notification-controller"]
# operator_version = "0.60.0"  # flux-operator chart version; unset = latest
cluster_type = "kubernetes" # kubernetes | openshift | aws | azure | gcp
ui_port = 9080              # local port for `devkit cluster flux-ui`

[tilt]
enabled = true

[manager]
namespace = "devkit-manager" # dashboard namespace
image = "devkit-manager"     # local image name (side-loaded via kind)
tag = "dev"
port = 8300                  # local port for `devkit manager open`

# Fleet manager (devkit fleet): one hub on an always-on machine, push agents on
# machines that run Bun, agentless probes for everything else.
[fleet]
port = 9300                          # hub listen port
hub = "http://localhost:9300"        # hub URL used by agent/status/open
token = ""                           # bearer token gating reports ("" = open)
db = "~/.local/share/devkit/fleet.db"
interval = 10                        # agent report cadence (seconds)
probe_interval = 30                  # hub probe cadence (seconds)
retention_hours = 48                 # sample history retention
stale_after = 60                     # seconds without a report -> stale
offline_after = 300                  # seconds without a report -> offline

# Agentless devices (phones, tablets, printers, IoT). With `port` the hub does
# a TCP connect; without it an ICMP ping.
[[fleet.probes]]
name = "yuri-phone"
host = "192.168.1.42"

[[fleet.probes]]
name = "nas"
host = "192.168.1.10"
port = 445

# Endpoints printed after `devkit up`.
[[endpoints]]
label = "Tilt UI"
url = "http://localhost:10350"

[[endpoints]]
label = "API"
url = "http://localhost:5221/api"

[[endpoints]]
label = "Web"
url = "http://localhost:5173"

[[endpoints]]
label = "Postgres"
url = "localhost:5433"

[[endpoints]]
label = "Redis"
url = "localhost:6379"

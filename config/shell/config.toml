[aliases]
lg = 'lazygit'
k = "kubectl"
#alias kx=kubectx
ls = 'eza --no-permissions --no-user --no-time'
lsl = 'eza --no-permissions --no-user --no-time --long'
u = 'update'
cat = 'bat --paging never --style plain'
#alias fzfp='fzf --preview="bat --style numbers --color=always {}"'
#alias d=docker
pu="pulumi"
# Route package managers through socket-firewall — it spins up an HTTP proxy
# that checks every fetched package against Socket's malware DB before it
# lands on disk. Non-network subcommands (cargo build, bun run, etc.) pass
# through unchanged. Bun isn't on sfw's official list but works (verified:
# "Protected by Socket Firewall" appears in verbose mode).
b = "sfw bun"
bun = "sfw bun"
pnpm = "sfw pnpm"
c = "sfw cargo"
cargo = "sfw cargo"
uv = "sfw uv"
cdo = "sfw cargo doc"
#alias cdoco=cargo doc --open
gs = "git status"
ga = "git add"
g = "gcloud"
gal = "gcloud auth login"

# Neovim. Config lives in the `nvim/` stow package; `vt` is the drill runner
# referenced by nvim/.config/nvim/docs/learning-plan.md.
v = "nvim"
vt = "nvim +Tutor"

# Starter pack — uncomment to try, drop the ones you dislike
#find = 'fd'                          # fd — flag syntax differs from BSD find
#grep = 'rg'                          # ripgrep — flag syntax differs from grep
#top  = 'btm'                         # bottom — TUI process viewer
#df   = 'duf'                         # duf — disk usage TUI
kx   = 'kubectx'                     # switch kubectl context
kg   = 'kgov'                        # toolbelt govern cluster findings in explore TUI
#kn   = 'kubens'                      # switch kubectl namespace
#kk   = 'k9s'                         # k9s cluster TUI
#fm   = 'yazi'                        # terminal file manager
#zj   = 'zellij'                      # terminal multiplexer
#h    = 'http'                        # httpie
#y    = 'yq'                          # YAML/JSON processor
#loc  = 'tokei --sort code -e target -e node_modules -e dist -e build -e .next -e .nx'  # lines of code, ignoring build dirs


# `update` shadows a nushell builtin, so nu users go through `u` (emitted as
# `^update` by the generator) or type `^update`. zsh/bash are unaffected.
# Not named `up` — that would shadow the Upbound CLI from brew "upbound/tap/up".
[functions.update]
description = "Refresh installed packages on this machine"
# A machine refresher must not stop at the first flaky upstream: with plain
# `set -e`, a failed `rustup self update` skipped cargo/node/uv/gcloud/regen.
# "continue" runs every step and exits 1 with a list of what failed.
on_error = "continue"
# Network-fetching steps call `sfw` explicitly: this runs as a bash script, where
# the interactive sfw aliases above don't apply. brew isn't sfw-supported.
commands = [
    "brew update",
    # brew bundle upgrades every outdated Brewfile entry (formulae + casks), so
    # there is no separate `brew upgrade`: it would only touch undeclared drift.
    "just -f $DOTCONFIG_DIR/justfile brew-install",
    "brew cleanup",
    # Self-update is its own step: `rustup update` bundles it, and its
    # exec-the-new-binary replace step fails intermittently on macOS — which
    # must not cost us the toolchain refresh.
    "rustup self update",
    "rustup update --no-self-update",
    # rust-analyzer is a rustup component (used by nvim's rustaceanvim), not a
    # brew package; `rustup update` alone never installs it.
    "rustup component add rust-analyzer",
    "just -f $DOTCONFIG_DIR/justfile cargo-install",
    # node-install writes config/node/package.json's ranges into bun's global
    # manifest; `bun update` (no --latest) then upgrades within those ranges.
    "just -f $DOTCONFIG_DIR/justfile node-install",
    "sfw bun update --global",
    "just -f $DOTCONFIG_DIR/justfile uv-install",
    "sfw uv tool upgrade --all",
    "gcloud components update --quiet",
    "just -f $DOTCONFIG_DIR/justfile regen"
]

[functions.csort]
description = "Format and sort cargo workspace"
commands = [
    "cargo fmt",
    "cargo sort --workspace"
]

[functions.drmi]
description = "Force-remove every docker image"
command = "docker images -aq | xargs -r docker rmi -f"

[functions.dsp]
description = "Prune all docker data: containers, images, networks, volumes"
commands = [
    "docker system prune -af",
    "docker volume prune -af"
]

# Note: `mcp`, `nx-run`, and `upkg` are no longer declared here. They live at
# config/scripts/{mcp,nx-run,upkg}.nu and are installed directly to ~/.local/bin/
# by the generator.

[environment]
EDITOR = "zed"
KUBE_EDITOR = "zed"
BROWSER = "open"
AI = "claude"

PROJECT = "rust"
TYPE = "be" # fe, devops, data, cli, operator, ci - tekton

# Locale / XDG (consolidated from hand-written zshrc + env.nu)
LANG = "en_US.UTF-8"
XDG_CONFIG_HOME = "$HOME/.config"

# Proxy exclusions. The sfw-wrapped package managers above set HTTP(S)_PROXY for
# child processes; loopback and the RFC 6761-reserved .test TLD (used by tests as
# a guaranteed-unresolvable host) must bypass the proxy. Both cases are honored
# by curl/reqwest/node; set both spellings — tools disagree on which they read.
NO_PROXY = "localhost,127.0.0.1,::1,.test"
no_proxy = "localhost,127.0.0.1,::1,.test"

# Homebrew behavior: `update` handles updates and cleanup explicitly, so suppress
# brew's implicit auto-update and post-install cleanup for predictable runs.
# HOMEBREW_BUNDLE_FILE lets bare `brew bundle` work from any directory.
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_INSTALL_CLEANUP = "1"
HOMEBREW_BUNDLE_FILE = "$DOTCONFIG_DIR/config/brew/Brewfile"

# cargo-binstall (used by `cargo liner ship`): only the crate's own published
# binaries or a source build — never QuickInstall's third-party builds, which
# also report every install to a stats server.
BINSTALL_STRATEGIES = "crate-meta-data,compile"
BINSTALL_DISABLE_TELEMETRY = "true"

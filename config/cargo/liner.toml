# cargo-liner config - global cargo packages
# Docs: https://docs.rs/cargo-liner
# Linked to $CARGO_HOME/liner.toml by `just cargo-install`.
#
# Run `cargo liner ship` to install/update everything below.
#
# Versions: `*` unless a crate publishes prerelease versions. cargo-liner's
# version check takes "latest" from `cargo search` (prereleases included) and
# ignores the requirement, while the install itself resolves the newest stable
# match, so such crates were reinstalled at the same version on every `u`.
# Those get a pinned line + `skip-check = true`: cargo-binstall then sees the
# newest match is already installed and does nothing.

[packages]
# Project scaffolding & generators
cargo-generate = "*"
create-tauri-app = "*"
tauri-cli = { version = "2", skip-check = true }   # 3.0.0-alpha.* on crates.io

# Build tools & task runners
cargo-make = "*"
trunk = { version = "0.21", skip-check = true }   # 0.22.0-beta.* on crates.io
cargo-run-script = "*"
cargo-watch = "*"
cargo-component = "*"
zesh = "*"

# Web frameworks & tools
cargo-leptos = "*"
salvo-cli = "*"
wasm-pack = "*"

# Development tools
cargo-nextest = "*"
du-dust = "*"

# Code inspection & editing
cargo-edit = "*"          # cargo upgrade / set-version (add/rm are built into cargo)
cargo-expand = "*"
cargo-modules = "*"
cargo-readme = "*"

#buildah-rs = "*"

# Code quality & testing
cargo-tarpaulin = "*"
cargo-sort = "*"
checker = "*"
rumdl = "*"
typos-cli = "*"

# Dependency management (`cargo tree` is built into cargo)
cargo-outdated = "*"
cargo-audit = "*"
cargo-deny = "*"
cargo-machete = "*"

# Release & deployment
cargo-release = "*"
cargo-bloat = "*"
sccache = "*"

# Database tools
sqlx-cli = "*"
sea-orm-cli = "*"

# Protocol buffers / codegen
protobuf-codegen = { version = "3", skip-check = true }   # 4.x: `-release`-suffixed library versions
typeshare-cli = "*"

# Cross-compilation
cross = "*"

# Kubernetes (no brew formula for kopium; binstall fetches the prebuilt release)
kopium = "*"

[defaults.ship]
# Use cargo-binstall when available (much faster than compiling from source)
binstall = "auto"
# Don't fail entire run if one package fails
no-fail-fast = true
